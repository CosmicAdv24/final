<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cosmic Adventure - Play Store Edition</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

:root {
  --sky: #1a0533; --accent: #ff6b35; --yellow: #ffd700; --teal: #00e5c8;
  --pink: #ff4fa3; --green: #4cff72; --blue: #4fa3ff; --purple: #b44fff;
  --card-bg: rgba(255,255,255,0.08); --card-border: rgba(255,255,255,0.15);
  --safe-top: env(safe-area-inset-top, 20px);
}

html, body { width: 100%; height: 100%; background: var(--sky); font-family: 'Nunito', sans-serif; overflow: hidden; color: #fff; }

#hud {
  position: absolute; top: var(--safe-top); left: 0; width: 100%;
  padding: 10px 20px; display: none; justify-content: space-between;
  align-items: center; z-index: 100; pointer-events: auto;
}

#hud.active { display: flex; }

.score-val { font-family: 'Fredoka One', cursive; font-size: 2.2rem; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }

canvas { display: none; width: 100%; height: 100%; background: transparent; touch-action: none; }
canvas.active { display: block; }

.screen, .overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: none; flex-direction: column; align-items: center;
  justify-content: center; text-align: center; padding: 20px; z-index: 10;
}

.screen.active, .overlay.active { display: flex; }

.overlay { background: rgba(0,0,0,0.85); z-index: 500; backdrop-filter: blur(8px); }

.home-title {
  font-family: 'Fredoka One', cursive; font-size: 3.2rem; margin-bottom: 20px;
  background: linear-gradient(#fff, #aaa); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

.card-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
  width: 100%; max-width: 450px;
}

.mode-card {
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: 20px; padding: 20px; cursor: pointer; transition: 0.2s;
}

.mode-card:active { transform: scale(0.95); background: rgba(255,255,255,0.15); }

.btn {
  padding: 15px 30px; border-radius: 50px; border: none;
  font-family: 'Fredoka One'; font-size: 1.2rem; cursor: pointer;
  color: #fff; margin: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  pointer-events: auto;
}

.btn-accent { background: linear-gradient(135deg, var(--accent), #ff8c35); }

#ad-banner {
  position: absolute; bottom: 0; width: 100%; height: 50px;
  background: #000; display: flex; align-items: center;
  justify-content: center; font-size: 10px; color: #444; z-index: 1000;
}
</style>
</head>

<body>
<div id="root">

  <div id="hud">
    <div>
      <span style="font-size:0.8rem; opacity:0.7;">SCORE</span><br>
      <span id="score-text" class="score-val">0</span>
    </div>
    <button class="btn" style="padding:10px; background:rgba(255,255,255,0.1);" onclick="pauseGame()">⏸️</button>
  </div>

  <div id="home-scr" class="screen active">
    <h1 class="home-title">COSMIC<br>ADVENTURE</h1>

    <div class="card-grid">
      <div class="mode-card" onclick="startGame('runner')"><div style="font-size:2.5rem">🚀</div>Runner</div>
      <div class="mode-card" onclick="startGame('bubble')"><div style="font-size:2.5rem">🫧</div>Ocean Pop</div>
      <div class="mode-card" onclick="startGame('catch')"><div style="font-size:2.5rem">🍬</div>Candy Catch</div>
      <div class="mode-card" onclick="startGame('maze')"><div style="font-size:2.5rem">🐸</div>Jungle Maze</div>
    </div>

    <button class="btn btn-accent" style="margin-top:20px;" onclick="PlayServices.showLeaderboard()">🏆 LEADERBOARDS</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="gameover-ov" class="overlay">
    <h2 style="font-family:'Fredoka One'; font-size:3.5rem; color:var(--pink);">FINISH!</h2>
    <div style="font-size:2rem; margin:20px;">Score: <span id="ov-score" style="color:var(--yellow); font-weight:900;">0</span></div>
    <button class="btn btn-accent" onclick="restartGame()">RETRY</button>
    <button class="btn" style="background:#555" onclick="goHome()">HOME</button>
  </div>

  <div id="ad-banner">AD_MOB_BANNER_SPACE</div>

</div>

<script>
// ----------------------
// 1. SERVICES
// ----------------------
const PlayServices = {
  init() { console.log("Google Play Services Ready"); },
  submitScore(mode, s) { console.log(`GPGS: Score ${s} sent to ${mode} leaderboard`); },
  showLeaderboard() { console.log("Show leaderboard requested"); }
};

const Ads = {
  showInterstitial() {
    let count = parseInt(localStorage.getItem('gamesPlayed') || '0') + 1;
    localStorage.setItem('gamesPlayed', count);
    if (count % 3 === 0) console.log("AdMob: Interstitial logic triggered");
  }
};

// ----------------------
// 2. AUDIO (placeholder)
// ----------------------
const sfx = {
  collect: { play(){} },
  hit: { play(){} },
  pop: { play(){} }
};

// ----------------------
// 3. GAME ENGINE CORE
// ----------------------
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W, H, mode = null, gameRunning = false, score = 0, animId = null, paused = false;
let lastTime = 0;

// mode-specific state
let runner, obstacles;
let bubbles;
let candies, basket;
let maze, playerCell;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  ctx.textBaseline = 'top';
}
window.addEventListener('resize', resize);
resize();

function updateScore(pts) {
  score += pts;
  if (score < 0) score = 0;
  document.getElementById('score-text').textContent = score;
}

function clearState() {
  runner = null;
  obstacles = [];
  bubbles = [];
  candies = [];
  basket = null;
  maze = null;
  playerCell = null;
}

function startGame(m) {
  clearState();
  mode = m;
  score = 0;
  gameRunning = true;
  paused = false;
  lastTime = performance.now();

  document.getElementById('home-scr').classList.remove('active');
  document.getElementById('gameover-ov').classList.remove('active');
  canvas.classList.add('active');
  document.getElementById('hud').classList.add('active');
  document.getElementById('score-text').textContent = "0";

  if (mode === 'runner') initRunner();
  if (mode === 'bubble') initBubble();
  if (mode === 'catch') initCatch();
  if (mode === 'maze') initMaze();

  cancelAnimationFrame(animId);
  animId = requestAnimationFrame(gameLoop);
}

function endGame() {
  if (!gameRunning) return;
  gameRunning = false;

  Ads.showInterstitial();
  document.getElementById('ov-score').textContent = score;
  document.getElementById('gameover-ov').classList.add('active');
  PlayServices.submitScore(mode, score);
}

function goHome() {
  gameRunning = false;
  cancelAnimationFrame(animId);

  canvas.classList.remove('active');
  document.getElementById('hud').classList.remove('active');
  document.getElementById('gameover-ov').classList.remove('active');
  document.getElementById('home-scr').classList.add('active');
}

function restartGame() {
  startGame(mode);
}

function pauseGame() {
  paused = !paused;
  if (!paused && gameRunning) {
    lastTime = performance.now();
    animId = requestAnimationFrame(gameLoop);
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (animId) cancelAnimationFrame(animId);
  } else {
    if (gameRunning && !paused) {
      lastTime = performance.now();
      animId = requestAnimationFrame(gameLoop);
    }
  }
});

// ----------------------
// 4. INPUT
// ----------------------
let pointer = {x:0, y:0, down:false};

function handlePointerDown(x, y) {
  pointer.down = true;
  pointer.x = x; pointer.y = y;

  if (!gameRunning) return;

  if (mode === 'runner') {
    if (runner.onGround) {
      runner.vy = -runner.jumpStrength;
      runner.onGround = false;
    }
  } else if (mode === 'bubble') {
    // pop bubble under finger
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      const dx = x - b.x;
      const dy = y - b.y;
      if (dx*dx + dy*dy <= b.r*b.r) {
        bubbles.splice(i,1);
        updateScore(5);
        sfx.pop.play();
        break;
      }
    }
  }
}

function handlePointerMove(x, y) {
  pointer.x = x; pointer.y = y;
  if (!gameRunning) return;

  if (mode === 'catch') {
    basket.x = x;
  }
}

function handlePointerUp() {
  pointer.down = false;
}

canvas.addEventListener('mousedown', e => handlePointerDown(e.offsetX, e.offsetY));
canvas.addEventListener('mousemove', e => handlePointerMove(e.offsetX, e.offsetY));
canvas.addEventListener('mouseup', handlePointerUp);
canvas.addEventListener('mouseleave', handlePointerUp);

canvas.addEventListener('touchstart', e => {
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  handlePointerDown(t.clientX - rect.left, t.clientY - rect.top);
}, {passive:false});

canvas.addEventListener('touchmove', e => {
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  handlePointerMove(t.clientX - rect.left, t.clientY - rect.top);
}, {passive:false});

canvas.addEventListener('touchend', handlePointerUp);

// ----------------------
// 5. MODES
// ----------------------

// RUNNER
function initRunner() {
  runner = {
    x: W * 0.2,
    y: 0,
    w: 40,
    h: 60,
    vy: 0,
    gravity: 0.7,
    jumpStrength: 14,
    onGround: false
  };
  obstacles = [];
}

function updateRunner(dt) {
  const groundY = H * 0.8;

  // gravity
  runner.vy += runner.gravity;
  runner.y += runner.vy;
  if (runner.y + runner.h > groundY) {
    runner.y = groundY - runner.h;
    runner.vy = 0;
    runner.onGround = true;
  }

  // spawn obstacles
  if (Math.random() < 0.015 * dt) {
    obstacles.push({
      x: W + 40,
      y: groundY - 40,
      w: 40,
      h: 40,
      speed: 0.4 * dt
    });
  }

  // move obstacles
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= o.speed;
    if (o.x + o.w < 0) {
      obstacles.splice(i,1);
      updateScore(10);
    }
  }

  // collisions
  for (const o of obstacles) {
    if (runner.x < o.x + o.w &&
        runner.x + runner.w > o.x &&
        runner.y < o.y + o.h &&
        runner.y + runner.h > o.y) {
      sfx.hit.play();
      endGame();
      return;
    }
  }

  updateScore(0.05 * dt);
}

function drawRunner() {
  const groundY = H * 0.8;

  // background
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#120322');
  grad.addColorStop(1, '#2b0b4a');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // ground
  ctx.fillStyle = '#2f1b4f';
  ctx.fillRect(0, groundY, W, H-groundY);

  // player
  ctx.fillStyle = '#ffd700';
  ctx.fillRect(runner.x, runner.y, runner.w, runner.h);

  // obstacles
  ctx.fillStyle = '#ff4fa3';
  for (const o of obstacles) {
    ctx.fillRect(o.x, o.y, o.w, o.h);
  }

  ctx.fillStyle = '#fff';
  ctx.font = '18px Nunito';
  ctx.fillText('RUNNER', 20, 20);
}

// BUBBLE
function initBubble() {
  bubbles = [];
}

function updateBubble(dt) {
  if (Math.random() < 0.02 * dt) {
    bubbles.push({
      x: Math.random() * W,
      y: H + 40,
      r: 20 + Math.random()*20,
      vy: -0.15 * dt
    });
  }

  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y += b.vy;
    if (b.y + b.r < 0) {
      bubbles.splice(i,1);
      updateScore(-5);
    }
  }

  if (score <= 0 && bubbles.length === 0) {
    endGame();
  }
}

function drawBubble() {
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#021b3a');
  grad.addColorStop(1, '#024b6b');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  for (let i = 0; i < 40; i++) {
    const x = (i * 97) % W;
    const y = (i * 53) % H;
    ctx.beginPath();
    ctx.arc(x,y,2,0,Math.PI*2);
    ctx.fill();
  }

  for (const b of bubbles) {
    const g = ctx.createRadialGradient(b.x-5,b.y-5,5,b.x,b.y,b.r);
    g.addColorStop(0,'rgba(255,255,255,0.9)');
    g.addColorStop(1,'rgba(0,229,200,0.3)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle = '#fff';
  ctx.font = '18px Nunito';
  ctx.fillText('OCEAN POP - tap bubbles', 20, 20);
}

// CATCH
function initCatch() {
  candies = [];
  basket = {
    x: W/2,
    y: H*0.85,
    w: 100,
    h: 20
  };
}

function updateCatch(dt) {
  if (Math.random() < 0.02 * dt) {
    candies.push({
      x: Math.random() * W,
      y: -20,
      r: 15,
      vy: 0.2 * dt,
      color: ['#ff4fa3','#ffd700','#4fa3ff','#4cff72'][Math.floor(Math.random()*4)]
    });
  }

  for (let i = candies.length - 1; i >= 0; i--) {
    const c = candies[i];
    c.y += c.vy;

    if (c.y - c.r > H) {
      candies.splice(i,1);
      updateScore(-5);
      continue;
    }

    if (c.y + c.r > basket.y &&
        c.y - c.r < basket.y + basket.h &&
        c.x > basket.x - basket.w/2 &&
        c.x < basket.x + basket.w/2) {
      candies.splice(i,1);
      updateScore(10);
      sfx.collect.play();
    }
  }

  if (score <= 0 && candies.length === 0) {
    endGame();
  }
}

function drawCatch() {
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#2b0b4a');
  grad.addColorStop(1, '#4a1030');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = '#fff';
  ctx.font = '18px Nunito';
  ctx.fillText('CANDY CATCH - move basket', 20, 20);

  ctx.fillStyle = '#ff6b35';
  ctx.fillRect(basket.x - basket.w/2, basket.y, basket.w, basket.h);

  for (const c of candies) {
    ctx.fillStyle = c.color;
    ctx.beginPath();
    ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
    ctx.fill();
  }
}

// MAZE
function initMaze() {
  const cols = 9;
  const rows = 13;
  const grid = [];
  for (let y = 0; y < rows; y++) {
    const row = [];
    for (let x = 0; x < cols; x++) {
      row.push(0);
    }
    grid.push(row);
  }

  for (let y = 0; y < rows; y++) {
    grid[y][0] = 1;
    grid[y][cols-1] = 1;
  }
  for (let x = 0; x < cols; x++) {
    grid[0][x] = 1;
    grid[rows-1][x] = 1;
  }

  for (let i = 0; i < 20; i++) {
    const rx = 1 + Math.floor(Math.random()*(cols-2));
    const ry = 1 + Math.floor(Math.random()*(rows-2));
    grid[ry][rx] = 1;
  }

  const stars = [];
  for (let i = 0; i < 10; i++) {
    const rx = 1 + Math.floor(Math.random()*(cols-2));
    const ry = 1 + Math.floor(Math.random()*(rows-2));
    if (grid[ry][rx] === 0) stars.push({x:rx,y:ry,collected:false});
  }

  maze = {cols,rows,grid,stars};
  playerCell = {x:1,y:1};

  window.addEventListener('keydown', mazeKeyHandler);
}

function mazeKeyHandler(e) {
  if (!gameRunning || mode !== 'maze') return;
  let dx = 0, dy = 0;
  if (e.key === 'ArrowUp') dy = -1;
  if (e.key === 'ArrowDown') dy = 1;
  if (e.key === 'ArrowLeft') dx = -1;
  if (e.key === 'ArrowRight') dx = 1;
  if (dx === 0 && dy === 0) return;

  const nx = playerCell.x + dx;
  const ny = playerCell.y + dy;
  if (maze.grid[ny] && maze.grid[ny][nx] === 0) {
    playerCell.x = nx;
    playerCell.y = ny;

    for (const s of maze.stars) {
      if (!s.collected && s.x === nx && s.y === ny) {
        s.collected = true;
        updateScore(20);
        sfx.collect.play();
      }
    }

    if (maze.stars.every(s => s.collected)) {
      endGame();
    }
  }
}

function updateMaze(dt) {
  // nothing time-based; movement via keys
}

function drawMaze() {
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#041b2f');
  grad.addColorStop(1, '#063b2f');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = '#fff';
  ctx.font = '18px Nunito';
  ctx.fillText('JUNGLE MAZE - arrow keys', 20, 20);

  const cellW = W / maze.cols;
  const cellH = (H*0.9) / maze.rows;
  const offsetY = H*0.1;

  for (let y = 0; y < maze.rows; y++) {
    for (let x = 0; x < maze.cols; x++) {
      if (maze.grid[y][x] === 1) {
        ctx.fillStyle = '#14301f';
        ctx.fillRect(x*cellW, offsetY + y*cellH, cellW, cellH);
      }
    }
  }

  for (const s of maze.stars) {
    if (s.collected) continue;
    ctx.fillStyle = '#ffd700';
    const cx = s.x*cellW + cellW/2;
    const cy = offsetY + s.y*cellH + cellH/2;
    ctx.beginPath();
    ctx.arc(cx,cy,Math.min(cellW,cellH)/4,0,Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle = '#4cff72';
  const px = playerCell.x*cellW + cellW*0.15;
  const py = offsetY + playerCell.y*cellH + cellH*0.15;
  ctx.fillRect(px,py,cellW*0.7,cellH*0.7);
}

// ----------------------
// 6. MAIN LOOP
// ----------------------
function gameLoop(timestamp) {
  if (!gameRunning) return;
  if (paused) {
    animId = requestAnimationFrame(gameLoop);
    return;
  }

  const dt = Math.min(40, timestamp - lastTime || 16);
  lastTime = timestamp;

  ctx.clearRect(0,0,W,H);

  if (mode === 'runner') {
    updateRunner(dt);
    drawRunner();
  } else if (mode === 'bubble') {
    updateBubble(dt);
    drawBubble();
  } else if (mode === 'catch') {
    updateCatch(dt);
    drawCatch();
  } else if (mode === 'maze') {
    updateMaze(dt);
    drawMaze();
  }

  animId = requestAnimationFrame(gameLoop);
}

PlayServices.init();
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js")
    .then(() => console.log("SW registered"))
    .catch(err => console.log("SW error", err));
}
</script>

</body>
</html>
